[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vbtdroid-proto"
version = "0.1.0"
description = "VBTdroid 独立 Python 参考实现"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "scipy",
    "pytest",
]

[project.scripts]
vbtdroid-analyze = "vbtdroid_proto.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
